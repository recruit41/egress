name: Build and push to Artifact Registry

on:
  push:
    tags:
      - 'v*-r41.*'

env:
  AR_REPO: asia-south1-docker.pkg.dev/avian-pulsar-430509-f6/r41-livekit

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          IMAGE="${AR_REPO}/egress:${GITHUB_REF_NAME}"
          docker build -t "$IMAGE" -f build/egress/Dockerfile .
          docker push "$IMAGE"
